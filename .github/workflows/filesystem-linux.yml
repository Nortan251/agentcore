name: filesystem-linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux full suite (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Full test suite
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p diagnostic-evidence
          python --version
          python -m pip freeze > diagnostic-evidence/environment.txt
          git rev-parse HEAD
          python -m pytest --collect-only -q -o addopts='' | tee diagnostic-evidence/collection.txt
          python - <<'PY'
          from pathlib import Path
          nodes = [line for line in Path('diagnostic-evidence/collection.txt').read_text().splitlines() if '::' in line]
          for index in range(int(len(nodes) * .88), min(len(nodes), int(len(nodes) * .92) + 1)):
              print(f'{index + 1}: {nodes[index]}')
          PY
          cat > diagnostic-evidence/diagnostic_trace.py <<'PY'
          import faulthandler
          import os
          import signal
          import time
          from pathlib import Path
          import pytest

          root = Path(__file__).parent
          traceback_file = None

          def record(phase, nodeid):
              fd = os.open(root / 'phases.txt', os.O_WRONLY | os.O_APPEND | os.O_CREAT, 0o600)
              try:
                  os.write(fd, f'{time.monotonic():.6f} PID={os.getpid()} {phase} {nodeid}\n'.encode())
              finally:
                  os.close(fd)

          def pytest_configure(config):
              global traceback_file
              traceback_file = open(root / 'tracebacks.txt', 'ab', buffering=0)
              faulthandler.register(signal.SIGUSR1, file=traceback_file, all_threads=True)

          @pytest.hookimpl(tryfirst=True)
          def pytest_runtest_setup(item):
              record('SETUP', item.nodeid)

          @pytest.hookimpl(tryfirst=True)
          def pytest_runtest_call(item):
              record('CALL', item.nodeid)

          @pytest.hookimpl(tryfirst=True)
          def pytest_runtest_teardown(item):
              record('TEARDOWN', item.nodeid)

          def pytest_runtest_logreport(report):
              record(f'REPORT_{report.when}_{report.outcome}', report.nodeid)

          def pytest_sessionfinish(session, exitstatus):
              record(f'SESSION_FINISH_{exitstatus}', '-')
          PY
          export PYTHONPATH="$PWD/diagnostic-evidence${PYTHONPATH:+:$PYTHONPATH}"
          (
            while true; do
              date -u
              ps -eo pid,ppid,pgid,sid,stat,wchan:32,etime,cmd --forest
              pstree -ap || true
              for pid in $(pgrep -u "$(id -u)" -f 'python.*pytest' || true); do
                if [ -r "/proc/$pid/status" ]; then
                  echo "=== /proc/$pid ==="
                  cat "/proc/$pid/status"
                  cat "/proc/$pid/wchan" || true
                fi
              done
              if [ -s diagnostic-evidence/phases.txt ]; then
                for pid in $(pgrep -u "$(id -u)" -f '^python -m pytest -q -p diagnostic_trace' || true); do
                  printf '\n=== SIGUSR1 PID=%s ===\n' "$pid" >> diagnostic-evidence/tracebacks.txt
                  kill -USR1 "$pid" 2>/dev/null || true
                  sleep 1
                done
              fi
              sleep 60
            done
          ) > diagnostic-evidence/processes.txt 2>&1 &
          sampler=$!
          set +e
          timeout --signal=TERM --kill-after=10s 8m \
            python -m pytest -q -p diagnostic_trace \
            2>&1 | tee diagnostic-evidence/pytest.txt
          result=${PIPESTATUS[0]}
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          date -u | tee -a diagnostic-evidence/processes.txt
          ps -eo pid,ppid,pgid,sid,stat,wchan:32,etime,cmd --forest | tee -a diagnostic-evidence/processes.txt
          pstree -ap | tee -a diagnostic-evidence/processes.txt || true
          tail -n 180 diagnostic-evidence/processes.txt
          tail -n 30 diagnostic-evidence/phases.txt || true
          cat diagnostic-evidence/tracebacks.txt || true
          exit "$result"

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-hang-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
