name: filesystem-linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux full suite (py3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Native stage-parent regressions
        run: python -m pytest -o addopts= tests/test_fs_stage_parent.py -v -rs

      - name: Filesystem and durable-execution regressions
        run: python -m pytest -o addopts= -q -ra tests/test_fs_*.py tests/test_workspace*.py tests/test_permissions*.py tests/test_task_43_2*.py

      - name: Full test suite
        run: python -m pytest -o addopts= -q -ra

      - name: Compile and whitespace checks
        run: |
          python -m compileall -q src tests
          git diff --check
