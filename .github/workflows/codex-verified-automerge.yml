name: codex-verified-automerge

on:
  workflow_run:
    workflows: ["filesystem-linux", "filesystem-windows"]
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: codex-verified-automerge
  cancel-in-progress: false

jobs:
  gate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted merge policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Merge only verified Codex PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python .github/automation/codex_verified_automerge.py
