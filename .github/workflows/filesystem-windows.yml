name: filesystem-windows

# Verifies the filesystem security foundation on a real Windows filesystem
# across every supported Python version (pyproject requires >= 3.11):
# junction/reparse-point rejection, true NTFS symlinks, ADS rejection, path
# forms, case-insensitive sensitive names, and the full suite.
#
# No third-party runtime dependencies: the project's own `dev` extra installs
# pytest, nothing else. Security tests are gating — nothing here uses
# `continue-on-error`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows fs verification (py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Version / reparse-point report
        shell: pwsh
        run: |
          @'
          import os, platform, subprocess, sys, tempfile
          from datetime import datetime, timezone
          from pathlib import Path

          print("python:", sys.version)
          print("runner:", platform.platform())

          # Wall-clock resolution / monotonicity probe (Task 40 §4/§8).
          vals = [datetime.now(timezone.utc) for _ in range(1000)]
          deltas = [(vals[i] - vals[i - 1]).total_seconds()
                    for i in range(1, len(vals))]
          neg = sum(1 for d in deltas if d < 0)
          print("clock probe: unique=", len(set(vals)), "/1000",
                "non_monotonic=", neg,
                "min_delta_s=", (min(deltas) if deltas else None))

          d = Path(tempfile.mkdtemp(prefix="agentcore_rep_"))
          (d / "target").mkdir()

          def run(label, cmd):
              r = subprocess.run(cmd, capture_output=True, text=True)
              print(f"{label}: rc={r.returncode} out={r.stdout.strip()!r} err={r.stderr.strip()!r}")

          run("mklink /J", ["cmd", "/c", "mklink", "/J", str(d / "j"), str(d / "target")])
          run("mklink /D", ["cmd", "/c", "mklink", "/D", str(d / "s"), str(d / "target")])
          for name in ("j", "s"):
              p = d / name
              print(f"{name}: is_symlink={p.is_symlink()} "
                    f"isjunction={getattr(os.path, 'isjunction', lambda x: 'n/a')(p)} "
                    f"resolve={p.resolve()} realpath={os.path.realpath(p)} "
                    f"attrs={hex(getattr(p.lstat(), 'st_file_attributes', 0))}")
          '@ | python -

      - name: Windows junction/reparse-point test
        run: python -m pytest tests/test_fs_paths.py -k junction -v -rs

      - name: Windows filesystem security tests
        run: python -m pytest tests/test_fs_windows.py -v -rs

      - name: Timeline ordering diagnostic (Task 40)
        shell: pwsh
        continue-on-error: true
        run: |
          @'
          import io, sys, tempfile
          from contextlib import redirect_stdout
          from pathlib import Path

          sys.path.insert(0, "tests")
          from test_cli_history import make_run  # noqa: E402
          from agentcore.cli import build_timeline, main  # noqa: E402
          from agentcore.state.store import JsonFileStateStore  # noqa: E402

          tmp = Path(tempfile.mkdtemp(prefix="agentcore_tl_"))
          run_id, _ = make_run(tmp)
          store = JsonFileStateStore(tmp / "runs")
          state = store.load(run_id)

          print("=== build_timeline events (at | order | kind | title) ===")
          for e in build_timeline(state):
              at = e.at.isoformat() if e.at else None
              print(f"  {at} | {e.order} | {e.kind} | {e.title}")

          buf = io.StringIO()
          with redirect_stdout(buf):
              code = main(["--runs-dir", str(tmp / "runs"), "history", run_id])
          print("=== RENDERED ===")
          print(buf.getvalue())
          print("=== exit code:", code)
          '@ | python -

      - name: Full test suite
        run: python -m pytest -q -rs
