name: stage5-linux-fork-compat-fix

on:
  push:
    branches: [codex/stage-5-final-hardening]
    paths:
      - ".github/workflows/stage5-linux-fork-compat-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage-5-final-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Patch inherited-registry handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/agentcore/tools/executor.py')
          text = path.read_text(encoding='utf-8')
          old = '''        supplied = dict(args or {})\n        tool = self.registry.get(tool_name)\n        tool_spec = tool.spec\n'''
          new = '''        supplied = dict(args or {})\n        try:\n            tool = self.registry.get(tool_name)\n        except ToolRegistryLeaseError:\n            return ToolInvocation(\n                tool_name,\n                {},\n                ToolResult.failure(\n                    "The trusted tool registration could not be verified.",\n                    kind="action_adapter_invalid",\n                ),\n                0.0,\n            )\n        tool_spec = tool.spec\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one invoke registry anchor, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run failing POSIX regression
        run: python -m pytest -q tests/test_task_43_2b_tool_executor_action_boundary.py::test_forked_child_executor_rejects_before_contended_registry_lock

      - name: Run registry and Stage 5 focused suites
        run: python -m pytest -q tests/test_tools.py tests/test_stage5_action_safety_integration.py tests/test_task_43_2b_tool_executor_action_boundary.py

      - name: Run full Linux suite
        run: python -m pytest -q

      - name: Compile and diff checks
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage5-linux-fork-compat-fix.yml
          git add src/agentcore/tools/executor.py
          git commit -m "fix(stage5): handle inherited tool registry categorically"
          git push origin HEAD:codex/stage-5-final-hardening
