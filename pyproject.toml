[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore"
version = "0.1.0"
description = "Foundation for a long-term autonomous AI computer agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth[cryptography]>=2.57,<3",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentcore = "agentcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
